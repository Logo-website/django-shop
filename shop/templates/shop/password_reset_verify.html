{% extends "shop/base.html" %}

{% block title %}Новый пароль{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-body p-4">
                <h3 class="text-center" style="color: var(--green-dark);">Новый пароль</h3>
                <p class="text-muted text-center">Мы отправили код на вашу почту. Введите его и новый пароль.</p>

                {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Код из письма</label>
                        <input type="text" name="code" class="form-control text-center"
                               style="font-size: 1.3rem; letter-spacing: 6px;"
                               maxlength="6" placeholder="000000" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Новый пароль</label>
                        <div class="input-group">
                            <input type="password" name="new_password" id="id_new_password" class="form-control" required>
                            <button type="button" class="btn btn-outline-secondary" onclick="togglePassword('id_new_password', 'eye1')">
                                <i id="eye1" class="bi bi-eye"></i>
                            </button>
                        </div>
                        <small class="text-muted">Мин. 8 символов, заглавная, строчная, цифра, спецсимвол.</small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Подтверждение пароля</label>
                        <input type="password" name="new_password2" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-cart btn-lg w-100">Изменить пароль</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
function togglePassword(fieldId, eyeId) {
    const field = document.getElementById(fieldId);
    const eye = document.getElementById(eyeId);
    if (field.type === 'password') {
        field.type = 'text';
        eye.className = 'bi bi-eye-slash';
    } else {
        field.type = 'password';
        eye.className = 'bi bi-eye';
    }
}
</script>
{% endblock %}
