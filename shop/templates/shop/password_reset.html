{% extends "shop/base.html" %}

{% block title %}Восстановление пароля{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-body text-center p-4">
                <i class="bi bi-key" style="font-size: 3rem; color: var(--green-main);"></i>
                <h3 class="mt-3" style="color: var(--green-dark);">Восстановление пароля</h3>
                <p class="text-muted">Введите email от вашего аккаунта.</p>

                {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <input type="email" name="email" class="form-control" placeholder="example@mail.ru" required>
                    </div>
                    <button type="submit" class="btn btn-cart btn-lg w-100">Отправить код</button>
                </form>
                <a href="{% url 'shop:login' %}" class="text-muted small mt-3 d-inline-block">Вернуться к входу</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
