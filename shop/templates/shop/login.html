{% extends "shop/base.html" %}

{% block title %}Вход{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h1 class="mb-4">Вход</h1>
        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Логин</label>
                <input type="email" name="email" class="form-control" placeholder="example@mail.ru" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Пароль</label>
                <div class="input-group">
                    <input type="password" name="password" id="id_password" class="form-control" required>
                    <button type="button" class="btn btn-outline-secondary" onclick="togglePassword('id_password', 'eye1')">
                        <i id="eye1" class="bi bi-eye"></i>
                    </button>
                </div>
            </div>
            <p class="text-end mb-3">
                <a href="{% url 'shop:password_reset_request' %}" class="small text-muted">Забыли пароль?</a>
            </p>
            <button type="submit" class="btn btn-primary btn-lg w-100">Войти</button>
        </form>
        <p class="mt-3 text-center">Нет аккаунта? <a href="{% url 'shop:register' %}">Зарегистрироваться</a></p>
    </div>
</div>

<script>
function togglePassword(fieldId, eyeId) {
    const field = document.getElementById(fieldId);
    const eye = document.getElementById(eyeId);
    if (field.type === 'password') {
        field.type = 'text';
        eye.className = 'bi bi-eye-slash';
    } else {
        field.type = 'password';
        eye.className = 'bi bi-eye';
    }
}
</script>
{% endblock %}
