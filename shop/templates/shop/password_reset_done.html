{% extends "shop/base.html" %}

{% block title %}Пароль изменён{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-body text-center p-4">
                <i class="bi bi-check-circle" style="font-size: 4rem; color: var(--green-main);"></i>
                <h3 class="mt-3" style="color: var(--green-dark);">Пароль успешно изменён!</h3>
                <p class="text-muted">Теперь войдите в аккаунт с новым паролем.</p>
                <a href="{% url 'shop:login' %}" class="btn btn-cart btn-lg mt-2">Войти</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
